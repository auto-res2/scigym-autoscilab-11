name: "Run Experiment"
run-name: "[${{ inputs.mode }}] ${{ inputs.run_id }}"

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Experiment mode'
        required: true
        type: choice
        options:
          - sanity
          - pilot
          - full
      branch_name:
        description: 'Branch name (e.g., main)'
      run_id:
        description: 'A single run_id to process'
        required: true
      runner_label:
        description: 'Runner label (e.g., ["ubuntu-latest"], ["self-hosted", "gpu-runner"])'
        required: true
        default: '["ubuntu-latest"]'
      secret_names:
        description: 'Comma-separated names of the secrets registered for this repository (names only); the observation hook redacts their values from observed.json'
        required: false
        default: ''

permissions:
  id-token: write
  contents: write
  actions: write

defaults:
  run:
    shell: bash

env:
  RESULTS_DIR: ".research/results"

jobs:
  run-experiment:
    name: Run Experiment (${{ inputs.mode }}) for ${{ inputs.run_id }}
    runs-on: ${{ fromJSON(inputs.runner_label) }}
    timeout-minutes: ${{ inputs.mode == 'sanity' && 1440 || 6000 }}

    outputs:
      experiment_passed: ${{ steps.check-result.outputs.passed }}

    env:
      RUN_ID: ${{ inputs.run_id }}
      MODE: ${{ inputs.mode }}
      AIRAS_SECRET_NAMES: ${{ inputs.secret_names }}
      # LLM inference experiments may use these provider keys.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      LANGFUSE_BASE_URL: ${{ secrets.LANGFUSE_BASE_URL }}
      LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
      LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      VERCEL_AI_GATEWAY_API_KEY: ${{ secrets.VERCEL_AI_GATEWAY_API_KEY }}
      RIKYU_API_KEY: ${{ secrets.RIKYU_API_KEY }}
      WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Docker and Dockerfile availability
        id: check-docker
        run: |
          has_docker=false
          has_dockerfile=false

          if docker info > /dev/null 2>&1; then
            has_docker=true
            echo "Docker is available"
          else
            echo "Docker is not available, will use native execution"
          fi

          if [ -f "Dockerfile" ]; then
            has_dockerfile=true
            echo "Dockerfile found"
          else
            echo "Dockerfile not found"
          fi

          echo "has_docker=$has_docker" >> "$GITHUB_OUTPUT"
          echo "has_dockerfile=$has_dockerfile" >> "$GITHUB_OUTPUT"

      - name: Prepare results dir
        # 同じ run の前回の出力を残さない: checkout に import 済みの出力があると実験がそこから再開してモデルを呼ばない(Seyval は実行前に空にする)
        run: |
          # Makefile の _require_run_id より先に走るので、ここでも同じ検証をしてから消す(../ で results の外へ出さない)
          case "$RUN_ID" in
            ""|*[!A-Za-z0-9_.-]*|.*) echo "::error::RUN_ID '$RUN_ID' may hold only letters, digits, '_', '.' and '-', and may not start with '.'"; exit 1 ;;
          esac
          rm -rf "$RESULTS_DIR/$RUN_ID"
          mkdir -p "$RESULTS_DIR"

      # A repository that ships a Dockerfile runs in it, or not at all: the
      # native path is for runners without Docker, not for an image that does
      # not build (a Lean run has no toolchain there, and an experiment would
      # run in an environment the commit never described).
      - name: Build Docker image
        if: steps.check-docker.outputs.has_docker == 'true' && steps.check-docker.outputs.has_dockerfile == 'true'
        id: build-docker
        uses: Wandalen/wretry.action@v3
        with:
          attempt_limit: 3
          attempt_delay: 30000
          command: |
            (
              set -e
              echo "=== [DOCKER BUILD] Start at $(date -u) ==="
              docker build -t airas-experiment:latest .
              echo "=== [DOCKER BUILD] Success at $(date -u) ==="
            ) 2>&1 | tee -a "$RESULTS_DIR/docker_build.log"

            exit_status=${PIPESTATUS[0]}
            if [ $exit_status -ne 0 ]; then
              echo "::error::Docker build failed (exit $exit_status); see docker_build.log in the results artifact"
              # The artifact holds only the run's directory, so put the log there.
              mkdir -p "$RESULTS_DIR/$RUN_ID"
              cp "$RESULTS_DIR/docker_build.log" "$RESULTS_DIR/$RUN_ID/docker_build.log"
              cat "$RESULTS_DIR/docker_build.log" >> "$RESULTS_DIR/$RUN_ID/stderr.txt"
              exit $exit_status
            fi

      - name: Install uv (fallback if no Docker)
        if: steps.check-docker.outputs.has_docker == 'false' || steps.check-docker.outputs.has_dockerfile == 'false'
        uses: Wandalen/wretry.action@v3
        with:
          action: astral-sh/setup-uv@v6
          with: |
            python-version: "3.11"
          attempt_limit: 3
          attempt_delay: 30000

      - name: Run experiment (Docker)
        if: steps.check-docker.outputs.has_docker == 'true' && steps.check-docker.outputs.has_dockerfile == 'true' && steps.build-docker.outcome == 'success'
        id: run-exp-docker
        continue-on-error: true
        uses: Wandalen/wretry.action@v3
        with:
          attempt_limit: 2
          attempt_delay: 60000
          command: |
            trap 'sleep 1' EXIT

            GPU_FLAGS=""
            if nvidia-smi > /dev/null 2>&1; then
              echo "GPU detected, enabling GPU support"
              GPU_FLAGS="--gpus all"
            else
              echo "No GPU detected, running without GPU support"
            fi

            docker run --rm $GPU_FLAGS \
              -v "$(pwd)/$RESULTS_DIR:/workspace/$RESULTS_DIR" \
              -e RUN_ID -e MODE -e RESULTS_DIR -e GITHUB_SHA -e AIRAS_SECRET_NAMES \
              -e ANTHROPIC_API_KEY \
              -e AWS_BEARER_TOKEN_BEDROCK \
              -e GEMINI_API_KEY \
              -e HF_TOKEN \
              -e LANGFUSE_BASE_URL \
              -e LANGFUSE_PUBLIC_KEY \
              -e LANGFUSE_SECRET_KEY \
              -e OPENAI_API_KEY \
              -e OPENROUTER_API_KEY \
              -e VERCEL_AI_GATEWAY_API_KEY \
              -e RIKYU_API_KEY \
              -e WANDB_API_KEY \
              airas-experiment:latest \
              bash -c '
                set -e
                set -o pipefail
                echo "=== [EXPERIMENT RUN] Start for $RUN_ID (mode=$MODE) at $(date -u) ==="
                make run RUN_ID="$RUN_ID" MODE="$MODE"
                echo "=== [EXPERIMENT RUN] PASSED for $RUN_ID at $(date -u) ==="
              ' > >(tee -a "$RESULTS_DIR/stdout.txt") 2> >(tee -a "$RESULTS_DIR/stderr.txt" >&2)

      - name: Run experiment (native)
        if: steps.check-docker.outputs.has_docker == 'false' || steps.check-docker.outputs.has_dockerfile == 'false'
        id: run-exp-native
        continue-on-error: true
        uses: Wandalen/wretry.action@v3
        with:
          attempt_limit: 2
          attempt_delay: 60000
          command: |
            trap 'sleep 1' EXIT
            (
              set -e
              set -o pipefail

              echo "=== [UV SYNC] Start at $(date -u) ==="
              uv sync
              echo "=== [UV SYNC] Finished successfully at $(date -u) ==="

              echo "=== [EXPERIMENT RUN] Start for $RUN_ID (mode=$MODE) at $(date -u) ==="
              make run RUN_ID="$RUN_ID" MODE="$MODE"
              echo "=== [EXPERIMENT RUN] PASSED for $RUN_ID at $(date -u) ==="
            ) > >(tee -a "$RESULTS_DIR/stdout.txt") 2> >(tee -a "$RESULTS_DIR/stderr.txt" >&2)

      - name: Check result
        id: check-result
        run: |
          outcome="${{ steps.run-exp-docker.outcome }}${{ steps.run-exp-native.outcome }}"
          passed=false
          if [[ "$outcome" == *"success"* ]] && grep -q "\[EXPERIMENT RUN\] PASSED" "$RESULTS_DIR/stdout.txt"; then
            if [[ "$MODE" == "sanity" ]]; then
              if grep -q "SANITY_VALIDATION: PASS" "$RESULTS_DIR/stdout.txt"; then
                passed=true
              else
                echo "Sanity validation did not pass"
              fi
            elif [[ "$MODE" == "pilot" ]]; then
              if grep -q "PILOT_VALIDATION: PASS" "$RESULTS_DIR/stdout.txt"; then
                passed=true
              else
                echo "Pilot validation did not pass"
              fi
            else
              passed=true
            fi
          fi
          echo "passed=$passed" >> "$GITHUB_OUTPUT"
          if [[ "$passed" == "true" ]]; then
            echo "Experiment passed for $RUN_ID (mode=$MODE)"
          else
            # Fail the job so the run's conclusion says so; results still upload (if: always()).
            echo "Experiment failed for $RUN_ID (mode=$MODE)"
            exit 1
          fi

      - name: Upload results
        if: always()
        uses: Wandalen/wretry.action@v3
        with:
          action: actions/upload-artifact@v4
          with: |
            name: ${{ inputs.mode }}-${{ github.run_id }}-${{ inputs.run_id }}
            path: ${{ env.RESULTS_DIR }}/${{ inputs.run_id }}
          attempt_limit: 3
          attempt_delay: 30000
