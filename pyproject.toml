[project]
name = "experiment"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pyyaml==6.0.2",
    "datasets>=3.0",  # SciGym のデータを HuggingFace から取る
    "openai>=1.30",
    "together>=1.2",  # 公式 autoscilab/llm/client.py が import 時に要求する（Together は使わない）
    "pydantic>=2.7",
    "numpy>=1.26",
    "scipy>=1.11",
]

# `src/` is run with `uv run python -m src.main` from the repository root,
# never installed as a distribution, so this project is not a package.
[tool.uv]
package = false
# 実験コードは SciGym の Simulator / Experiment / Controller を使うので、評価層の scigym extra に入る SciGym をそのまま使う
default-groups = ["eval"]
# aarch64 に wheel が無い固定版だけ差し替える（RIKYU の scigym_improvement と同じ）
prerelease = "allow"
override-dependencies = ["antimony==2.14.0", "libroadrunner==2.7.0"]
# python-libnuml / python-libcombine は aarch64 の sdist ビルドが落ちる。tellurium は libnuml を使わず、
# libcombine は import 時に参照するだけなので Dockerfile でスタブを置く
exclude-dependencies = ["rrplugins", "phrasedml", "python-libnuml", "python-libcombine"]

# 評価層。ベンチマークパック scigym_small は SciGym（コミット固定）と pygraphviz を extra で持つ
[dependency-groups]
eval = ["airas-eval[scigym]"]

[tool.uv.sources]
airas-eval = { git = "https://github.com/airas-org/airas-eval", tag = "v0.13.1" }
